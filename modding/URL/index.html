<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Simple URL Viewer</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/octos@latest/octos.min.js"></script>
    <iframe id="iframe" src=""></iframe>
    <script>
        const iframe = document.getElementById('iframe');
        const userOptions = new octos.UserOptions();

        function handleOptions({id, value}) {
            if (id == 'url') {
                iframe.src = value;
            }
        }

        userOptions.on('change', handleOptions)
        userOptions.on('load', handleOptions)
    </script>
</body>

</html>
