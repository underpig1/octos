<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="turbulence">
            <feTurbulence id="turbulence-filter" type="turbulence" baseFrequency="0.01" numOctaves="5"
                result="turbulence" stitchTiles="stitch" />
            <feOffset id="offset" in="turbulence" dx="0" dy="0" result="offset">
                <animate
          attributeName="dx"
          dur="20s"
          repeatCount="indefinite"
          values="-200;200"
        />
        <animate
          attributeName="dy"
          dur="20s"
          repeatCount="indefinite"
          values="-200;200"
        />
            </feOffset>
            <feDisplacementMap in2="offset" in="SourceGraphic" scale="500" result="displacement" />
            <!-- <feGaussianBlur in="displacement" stdDeviation="2" /> -->
        </filter>
    </defs>
    <image href="https://underpig1.github.io/octos/web/background.png" width="1920"
        height="1080" filter="url(#turbulence)" opacity="1" />
</svg>