name: API
on:
  push:
    branches: [master]
    paths:
      - "src/js/**"
  pull_request:
    branches: [master]
    paths:
      - "src/js/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install npm dependencies
        run: npm install
      - name: Build API
        run: npm run build-api
