name: Build
on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - '.github/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - '.github/**'
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Install vcpkg dependencies
      run: |
        vcpkg install --triplet x64-windows
        vcpkg integrate install
      working-directory: .
      env:
        VCPKG_ROOT: C:\vcpkg
    - name: Build
      run: msbuild Octos.vcxproj /p:Configuration=Release