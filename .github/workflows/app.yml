name: Build
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Octos.vcxproj"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "Octos.vcxproj"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1
      - name: Integrate vcpkg
        run: vcpkg integrate install
      - name: Build
        run: msbuild Octos.vcxproj /p:Configuration=Release