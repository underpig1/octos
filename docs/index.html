<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Octos Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="icon" type="image/x-icon" href="_media/icon.ico">
  <link rel="shortcut icon" href="_media/icon.ico" type="image/x-icon">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Octos',
      repo: 'https://github.com/underpig1/octos',
      themeColor: '#e52e2eff',
      logo: '/_media/icon.png',
      search: 'auto',
      nameLink: '/',
      loadSidebar: true,
      plugins: [
        (hook, vm) => {
          hook.beforeEach(html => {
            if (/githubusercontent\.com/.test(vm.route.file)) {
              url = vm.route.file
                .replace('raw.githubusercontent.com', 'github.com')
                .replace(/\/master/, '/blob/master')
                .replace(/\/main/, '/blob/main');
            } else if (/jsdelivr\.net/.test(vm.route.file)) {
              url = vm.route.file
                .replace('cdn.jsdelivr.net/gh', 'github.com')
                .replace('@main', '/blob/main');
            } else {
              url =
                'https://github.com/underpig1/octos/tree/master/docs/' +
                vm.route.file;
            }

            const footerHTML = [
              '<hr>',
              '<div style="display: flex; align-items: center; justify-content: space-between;">',
              '  <span>Powered by <a href="/">Docsify.js</a></span>',
              `  <a href="${url}" style="display: inline-flex; align-items: center; gap: 0.25em;">Edit on GitHub</a>`,
              '</div>',
            ].join('\n');

            return html + footerHTML;
          });
        }
      ]
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
</html>
