    <style>
        html,
        body {
            background-color: #ff4040;
            width: 100%;
            height: 100%;
            margin: 0;
        }

        :root {
            --x: 0px;
            --y: 0px;
        }

        svg {
            position: absolute;
        }

        #i3 {
            position: absolute;
            width: 100px;
            height: 100px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: filter 0.2s;
        }

        #i3 > svg {
            opacity: 1;
            z-index: 1;
        }

        #i1 {
            --dir: 0.5;
            transform: translate(calc(var(--dir)*var(--x)), calc(var(--dir)*var(--y)));
                filter: blur(2px);
                opacity: 1;
        }

        #i2 {
            --dir: -1;
            animation-delay: 0.2s;
            transform: translate(calc(var(--dir)*var(--x)), calc(var(--dir)*var(--y)));
                filter: blur(2px);
                opacity: 1;
            /* animation-delay: 0s; */
        }

        /* #i3:hover {

            opacity: 0 !important;
        } */

    <script>
        document.body.onmousemove = (e) => {
            let cx = e.clientX - window.innerWidth/2, cy = e.clientY - window.innerHeight/2;
            let dist = Math.hypot(cx, cy)/2;
            let x = -cx/dist, y = -cy/dist;
            document.documentElement.style.setProperty('--x', x + 'px');
            document.documentElement.style.setProperty('--y', y + 'px');
        }
    </script>
